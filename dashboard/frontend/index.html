<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Adaptive Headlight — Real-time beam control dashboard">
    <title>Smart Adaptive Headlight — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </div>
                <h1>Smart Adaptive Headlight</h1>
            </div>
            <div class="header-right">
                <span id="connection-status" class="status-badge disconnected">Disconnected</span>
                <span id="fps-counter" class="fps-badge">0 FPS</span>
            </div>
        </header>

        <!-- Main Grid -->
        <main id="main-grid">
            <!-- Video Feed -->
            <section id="video-section" class="card">
                <div class="card-header">
                    <h2>Live Feed</h2>
                    <span id="beam-mode" class="mode-badge">LOW_BEAM</span>
                </div>
                <div class="video-container">
                    <img id="video-feed" alt="Camera feed" />
                    <div id="video-overlay" class="video-overlay"></div>
                </div>
            </section>

            <!-- Zone Brightness Strip -->
            <section id="zone-section" class="card">
                <div class="card-header">
                    <h2>Beam Zones</h2>
                </div>
                <div id="zone-strip" class="zone-strip">
                    <!-- Zones generated by JS -->
                </div>
                <div class="zone-labels">
                    <span>-40°</span>
                    <span>0°</span>
                    <span>+40°</span>
                </div>
            </section>

            <!-- Risk Chart -->
            <section id="risk-section" class="card">
                <div class="card-header">
                    <h2>Zone Risk Scores</h2>
                </div>
                <div id="risk-bars" class="risk-bars">
                    <!-- Generated by JS -->
                </div>
            </section>

            <!-- Explainability Panel -->
            <section id="explain-section" class="card">
                <div class="card-header">
                    <h2>Decision Explanation</h2>
                </div>
                <div id="explain-content" class="explain-content">
                    <p class="placeholder-text">Waiting for data...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
